name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate responsive images
        run: |
          python3 scripts/resize_images.py || echo "resize script exited non-zero"

      - name: Commit generated images (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-*.jpg || true
          if git diff --staged --quiet; then
            echo "No generated images to commit"
          else
            git commit -m "chore: generate responsive hero images [ci skip]" || echo "commit failed"
            git push || echo "push failed"
          fi

      - name: Prepare publish directory
        run: |
          rm -rf .publish
          mkdir -p .publish
          cp index.html .publish/
          cp -r assets .publish/
          cp README.md .publish/ || true
          cp CNAME .publish/ || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: .publish

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
